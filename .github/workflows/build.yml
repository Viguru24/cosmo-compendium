name: Build Cosmo Compendium (macOS DMG & iOS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build Mac Catalyst Application
        run: |
          xcodebuild -project "CosmoCompendium-iOS/CosmoCompendium.xcodeproj" \
                     -scheme "CosmoCompendium" \
                     -destination "generic/platform=macOS,variant=Mac Catalyst" \
                     -derivedDataPath "$GITHUB_WORKSPACE/build/macOS" \
                     -configuration Release \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package macOS DMG
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APP_PATH="$GITHUB_WORKSPACE/build/macOS/Build/Products/Release-maccatalyst/CosmoCompendium.app"
          hdiutil create -volname "Cosmo Compendium" \
                         -srcfolder "$APP_PATH" \
                         -ov -format UDZO \
                         "$GITHUB_WORKSPACE/dist/CosmoCompendium-macOS.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoCompendium-macOS-DMG
          path: dist/CosmoCompendium-macOS.dmg

  build-ios-app:
    name: Build iOS App & Simulator Bundle
    runs-on: macos-14
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build iOS Simulator App
        run: |
          xcodebuild -project "CosmoCompendium-iOS/CosmoCompendium.xcodeproj" \
                     -scheme "CosmoCompendium" \
                     -destination "generic/platform=iOS Simulator" \
                     -derivedDataPath "$GITHUB_WORKSPACE/build/iOS-Simulator" \
                     -configuration Release \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package iOS Simulator Bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APP_PATH="$GITHUB_WORKSPACE/build/iOS-Simulator/Build/Products/Release-iphonesimulator/CosmoCompendium.app"
          cd "$GITHUB_WORKSPACE/build/iOS-Simulator/Build/Products/Release-iphonesimulator"
          zip -r "$GITHUB_WORKSPACE/dist/CosmoCompendium-iOS-Simulator.zip" CosmoCompendium.app

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoCompendium-iOS-Simulator
          path: dist/CosmoCompendium-iOS-Simulator.zip

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-macos-dmg, build-ios-app]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CosmoCompendium-macOS-DMG/CosmoCompendium-macOS.dmg
            artifacts/CosmoCompendium-iOS-Simulator/CosmoCompendium-iOS-Simulator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
